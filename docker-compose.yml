services:
  offerlai:
    build:
      context: .
    image: ghcr.io/yuecao365/offerlai:latest
    ports:
      - "3000:3000"
    environment:
      APP_MODE: local
      DATABASE_URL: file:/data/dev.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_INTERVIEW_MODEL: ${OPENAI_INTERVIEW_MODEL:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-}
    volumes:
      - offerlai-data:/data
      - offerlai-local:/app/.local
    restart: unless-stopped

volumes:
  offerlai-data:
  offerlai-local:
