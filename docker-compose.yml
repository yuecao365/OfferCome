services:
  offercome:
    build:
      context: .
    image: ghcr.io/yuecao365/offercome:latest
    ports:
      - "3000:3000"
    environment:
      APP_MODE: local
      DATABASE_URL: file:/data/dev.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_INTERVIEW_MODEL: ${OPENAI_INTERVIEW_MODEL:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-}
    volumes:
      - offercome-data:/data
      - offercome-local:/app/.local
    restart: unless-stopped

volumes:
  offercome-data:
  offercome-local:
